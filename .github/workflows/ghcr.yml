name: Self-host GHCR Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'bernylinville/cumora'
    name: Build self-host server image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies without desktop postinstall scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck server
        run: npm run server:typecheck
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bernylinville/cumora-server
          tags: |
            type=sha,format=long
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build API and same-origin web app
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/docker/cumora-server.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=cumora-server
          cache-to: type=gha,mode=max,scope=cumora-server
      - name: Record immutable deployment image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' '### Self-host image' >> "$GITHUB_STEP_SUMMARY"
          printf 'ghcr.io/bernylinville/cumora-server@%s\n' "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          printf 'Source commit: %s\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
